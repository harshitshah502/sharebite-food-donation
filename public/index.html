<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShareBite 2.0</title><style>
:root{--g:#177245;--dark:#0d5634;--mint:#e8f6ee;--ink:#192b21;--muted:#6b7b70;--line:#e1eae3;--bg:#f5f8f5}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,Segoe UI,sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{border:0;border-radius:10px;padding:10px 14px;background:var(--g);color:white;font-weight:700;cursor:pointer}button:hover{background:var(--dark)}button.alt{background:#eaf3ed;color:var(--dark)}button.red{background:#b63d35}.top{background:white;border-bottom:1px solid var(--line);padding:16px 5%;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0}.brand{font-size:22px;font-weight:850;color:var(--g)}#app{max-width:1150px;margin:auto;padding:24px 18px}.hero{background:linear-gradient(120deg,var(--dark),#208a54);color:white;border-radius:20px;padding:28px;margin-bottom:18px}.hero h1{margin:0 0 8px;font-size:clamp(27px,4vw,38px)}.hero p{margin:0;color:#d8f0e0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}.card,.stat{background:white;border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:15px;box-shadow:0 8px 26px #143f2510}.statrow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}.stat strong{font-size:27px;display:block}.muted{color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{background:#e9f1eb;color:var(--dark)}.tabs button.on{background:var(--g);color:white}.field{margin:10px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #d8e3da;border-radius:9px;background:#fff}.field textarea{min-height:68px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.food{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:white;margin-bottom:12px}.photo{height:130px;background:#e6f3e9;display:grid;place-items:center;font-size:36px}.photo img{width:100%;height:100%;object-fit:cover}.foodbody{padding:13px}.pill{font-size:11px;background:var(--mint);color:var(--dark);border-radius:50px;padding:5px 8px;font-weight:800}.item{padding:12px;border:1px solid var(--line);border-radius:11px;margin:9px 0}.item h3{font-size:15px;margin:0 0 6px}.item p{font-size:12px;color:var(--muted);margin:5px 0}.status{font-size:11px;border-radius:20px;background:#eef3ef;padding:4px 7px}.pending{background:#fff0cf}.accepted,.completed{background:#dff3e5}.rejected,.cancelled{background:#fde8e5}.notice{padding:10px;border-radius:10px;background:#eaf6ed;margin:10px 0;font-size:13px}.error{background:#fde8e5;color:#9c332d}.auth{max-width:900px;margin:30px auto;background:white;border-radius:20px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line)}.authaside{padding:35px;background:linear-gradient(145deg,var(--dark),#238954);color:white}.authaside p{line-height:1.6;color:#d9f0e0}.authmain{padding:30px}.small{font-size:12px}.footer{text-align:center;color:var(--muted);font-size:12px;padding:20px}@media(max-width:760px){.grid,.cols,.auth{grid-template-columns:1fr}.statrow{grid-template-columns:repeat(2,1fr)}.authaside{padding:22px}.authmain{padding:22px}}
</style><style>
:root{
  --g:#287453;--dark:#174a36;--mint:#e6f2e8;--ink:#1f3028;--muted:#748078;
  --line:#e2e7dd;--bg:#f5f3eb;--accent:#e28b55;--paper:#fffefa;
}
body{background:radial-gradient(ellipse at 90% 4%,#e4eee1 0,transparent 28%),var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.top{z-index:20;padding:13px max(5%,calc((100% - 1180px)/2));background:#fffefaee;border-bottom:1px solid #dce5da;box-shadow:0 5px 22px #203b2b0b;backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-size:22px;letter-spacing:-.8px;color:var(--dark)}
.brand:before{content:"\2726";display:grid;place-items:center;color:#fff;font-size:20px;width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#f2b66e,#df8250);box-shadow:inset 0 1px #ffffff80,0 5px 12px #ca7b4d33}
#account{display:flex;align-items:center;gap:12px}
#app{max-width:1180px;padding:30px 20px 50px}
button{position:relative;overflow:hidden;border-radius:12px;padding:11px 17px;background:linear-gradient(135deg,#32805b,#216646);box-shadow:0 5px 12px #1c684020;transition:transform .22s cubic-bezier(.2,.8,.2,1),box-shadow .22s,background .22s,color .22s}
button:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 20%,#ffffff38 48%,transparent 72%);transform:translateX(-130%);transition:transform .5s}
button:hover{background:linear-gradient(135deg,#398b63,#205e40);transform:translateY(-2px);box-shadow:0 9px 18px #1c684032}
button:hover:after{transform:translateX(130%)}
button:active{transform:translateY(1px) scale(.97);box-shadow:0 2px 6px #1c684020}
button:focus-visible{outline:3px solid #e5a06d;outline-offset:3px}
button.alt{background:#edf2e8;color:var(--dark);box-shadow:inset 0 0 0 1px #dce6d9}
button.alt:hover{background:#dfeadd;color:#123f2d}
button.red{background:linear-gradient(135deg,#ca6452,#a94336);box-shadow:0 5px 12px #a9433625}
.hero{position:relative;isolation:isolate;overflow:hidden;border:1px solid #ffffff1c;border-radius:26px;padding:36px 38px;background:linear-gradient(118deg,#173e2d 0%,#246344 58%,#408363 100%);box-shadow:0 18px 40px #234b3025;margin:4px 0 22px}
.hero:before,.hero:after{content:"";position:absolute;z-index:-1;border-radius:50%;pointer-events:none}
.hero:before{width:300px;height:300px;right:7%;top:-190px;border:1px solid #ffffff21;box-shadow:0 0 0 28px #ffffff08,0 0 0 58px #ffffff06}
.hero:after{width:170px;height:170px;right:-48px;bottom:-105px;background:#eab17b18}
.hero h1{max-width:650px;font-size:clamp(32px,5vw,48px);letter-spacing:-1.8px;line-height:1.08}
.hero p{max-width:720px;color:#e0efe5;line-height:1.65}
.pill{background:#f1e7d7;color:#74502e;letter-spacing:.2px}
.statrow{gap:14px;margin:18px 0 23px}
.stat{position:relative;overflow:hidden;background:var(--paper);border:1px solid #e8e5d9;border-radius:18px;padding:19px 20px;box-shadow:0 8px 22px #263d2c0a;transition:transform .25s,box-shadow .25s}
.stat:hover{transform:translateY(-4px);box-shadow:0 14px 26px #263d2c13}
.stat strong{margin-top:7px;color:var(--dark);font-size:32px;letter-spacing:-1px}
.stat:after{content:"";position:absolute;width:46px;height:46px;right:15px;top:17px;border-radius:16px;background:#e8f1e5}
.stat:nth-child(2):after{background:#f8e9d8}.stat:nth-child(3):after{background:#f7e6df}.stat:nth-child(4):after{background:#e3ece8}
.card{background:var(--paper);border:1px solid #e9e6dd;border-radius:18px;padding:20px;box-shadow:0 8px 24px #263d2c0b}
.card h3{margin:2px 0 15px;letter-spacing:-.25px}
.tabs{gap:9px;margin:20px 0 17px}
#app>.tabs{padding:7px;width:max-content;max-width:100%;background:#e9e9df;border:1px solid #e0e1d6;border-radius:16px}
#app>.tabs button{overflow:visible;background:transparent;color:#647269;box-shadow:none;border-radius:11px;padding:10px 16px;transition:transform .3s cubic-bezier(.2,.9,.25,1.4),background .25s,color .2s,box-shadow .25s}
#app>.tabs button:after{display:none}
#app>.tabs button:hover{background:#f7f6ef;color:var(--dark);transform:translateY(-2px)}
#app>.tabs button.on{background:var(--dark);color:#fff;box-shadow:0 5px 12px #174a3630;animation:menuArrive .38s cubic-bezier(.2,.9,.25,1.35)}
@keyframes menuArrive{0%{transform:scale(.88) translateY(3px)}65%{transform:scale(1.06) translateY(-1px)}100%{transform:scale(1)}}
.auth .tabs button{transition:transform .2s,box-shadow .2s}
.auth .tabs button:hover{transform:translateY(-2px)}
.cols{gap:19px}
.field{margin:13px 0}
.field label{font-size:12px;letter-spacing:.25px;color:#53645a}
.field input,.field select,.field textarea{border:1px solid #dfe5da;border-radius:11px;padding:11px 12px;background:#fffefa;transition:border-color .2s,box-shadow .2s}
.field input:focus,.field select:focus,.field textarea:focus{outline:0;border-color:#78a488;box-shadow:0 0 0 4px #43865b18}
.food{border:1px solid #e8e6dc;border-radius:17px;box-shadow:0 7px 20px #263d2c0a;transition:transform .25s,box-shadow .25s}
.food:hover{transform:translateY(-4px);box-shadow:0 15px 28px #263d2c16}
.photo{height:160px;background:linear-gradient(135deg,#e7eee1,#f5e7d7)}
.foodbody{padding:16px}
.item{background:#fffefa;border-color:#e8e8df;padding:14px;border-radius:13px}
.item h3{letter-spacing:-.2px}
.status{font-weight:700;color:#53645a}
.notice{background:#e8f2e6;border:1px solid #d8e8d5;color:#315943}
.notice.error{background:#fde9e4;color:#9c332d}
.auth{border-color:#e6e4da;border-radius:25px;box-shadow:0 20px 60px #263d2c15}
.authaside{position:relative;isolation:isolate;overflow:hidden;background:linear-gradient(145deg,#173e2d,#397654);padding:42px}
.authaside:after{content:"";position:absolute;z-index:-1;right:-65px;bottom:-85px;width:260px;height:260px;border-radius:50%;border:1px solid #ffffff2d;box-shadow:0 0 0 25px #ffffff09,0 0 0 55px #ffffff07}
.authaside h1{font-size:clamp(30px,4vw,42px);letter-spacing:-1.4px;line-height:1.1}
.authmain{padding:36px;background:var(--paper)}
.authmain h2{letter-spacing:-.8px}
.footer{color:#8a9187;padding:22px}
#content{animation:contentIn .32s ease-out}
@keyframes contentIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:760px){
 #app{padding:20px 14px 35px}.top{padding:11px 16px}.brand{font-size:20px}
 .hero{padding:27px 23px;border-radius:21px}.statrow{gap:9px}.stat{padding:15px}.stat strong{font-size:28px}
 #app>.tabs{width:100%;overflow-x:auto;flex-wrap:nowrap}#app>.tabs button{white-space:nowrap;padding:10px 13px}
 .authaside{padding:28px 23px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style><style>
.statbutton{display:block;width:100%;text-align:left;color:var(--ink);cursor:pointer}.statbutton:hover{background:#fffefa;transform:translateY(-4px);box-shadow:0 14px 26px #263d2c18}.stat-hint{display:block;margin-top:9px;color:#78847b;font-size:11px;font-weight:650}.filterbar{justify-content:space-between;margin-bottom:12px}.filterbar h3{margin:2px 0}.filterset{display:flex;gap:7px;flex-wrap:wrap}.filterchip{padding:8px 12px;border-radius:999px;background:#eff1e9;color:#53645a;box-shadow:none;font-size:12px}.filterchip:after{display:none}.filterchip:hover{background:#e1eadf;color:var(--dark);transform:translateY(-1px)}.filterchip.selected{background:var(--dark);color:#fff;box-shadow:0 4px 10px #174a3625}@media(max-width:760px){.filterbar{align-items:flex-start}.filterset{width:100%}.filterchip{padding:8px 10px}}
</style></head><body><header class="top"><div class="brand">ShareBite</div><div id="account"></div></header><main id="app"></main><div class="footer">ShareBite 2.0 · Local coursework prototype</div><script>
const $=s=>document.querySelector(s);let me=null,dash=null,tab='overview',mode='login',listingFilter='all',requestFilter='all';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dt=s=>s?new Date(s).toLocaleString():'Not set';async function api(url,opt={}){let o={...opt,headers:{...(opt.headers||{})}};if(o.body&&!(o.body instanceof FormData)){o.headers['Content-Type']='application/json';o.body=JSON.stringify(o.body)}let r=await fetch(url,o),d=await r.json();if(!r.ok)throw Error(d.error||'Request failed');return d}function flash(t,err=false){let x=$('#flash');if(x){x.textContent=t;x.className='notice'+(err?' error':'')}else alert(t)}function auth(m='login'){mode=m;me=null;tab='overview';listingFilter='all';requestFilter='all';$('#account').innerHTML='';$('#app').innerHTML=`<section class="auth"><div class="authaside"><h1>Good food.<br>Better sharing.</h1><p>Connect surplus food with local communities. Publish donations, coordinate requests, and record feedback.</p><p class="small">Local full-stack prototype</p></div><div class="authmain"><h2>${m==='login'?'Welcome back':'Create account'}</h2><p class="muted">Sign in to your ShareBite workspace.</p><div class="tabs"><button class="${m==='login'?'on':'alt'}" id="lt">Sign in</button><button class="${m==='register'?'on':'alt'}" id="rt">Register</button></div><div id="flash"></div><form id="af">${m==='register'?'<div class="field"><label>Full name</label><input name="name" required></div>':''}<div class="field"><label>Email</label><input name="email" type="email" required></div><div class="field"><label>Password ${m==='register'?'(at least 8 characters)':''}</label><input name="password" type="password" minlength="${m==='register'?8:1}" required></div>${m==='register'?'<div class="field"><label>Role</label><select name="role"><option value="donor">Food donor</option><option value="ngo">NGO</option><option value="receiver">Food receiver</option></select></div><div class="field"><label>Organization (optional)</label><input name="organization"></div>':''}<button style="width:100%">${m==='login'?'Sign in':'Create account'}</button></form><div class="card" style="margin-top:16px"><b>Demo accounts</b><p class="muted">Password: demo123</p><div class="small">admin@sharebite.demo<br>donor@sharebite.demo<br>ngo@sharebite.demo<br>receiver@sharebite.demo</div><button class="alt" id="demo" style="margin-top:8px">Sign in as donor demo</button></div></div></section>`;$('#lt').onclick=()=>auth('login');$('#rt').onclick=()=>auth('register');$('#demo').onclick=()=>{let f=$('#af');f.email.value='donor@sharebite.demo';f.password.value='demo123';f.requestSubmit()};$('#af').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),b=Object.fromEntries(f.entries());try{let d=await api(m==='login'?'/api/auth/login':'/api/auth/register',{method:'POST',body:b});me=d.user;await load()}catch(e){flash(e.message,true)}}}async function load(){dash=await api('/api/dashboard');me=dash.user;$('#account').innerHTML=`<span class="muted">${esc(me.name)} · ${esc(me.role)} </span> <button class="alt" id="out">Sign out</button>`;$('#out').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});auth()};render()}function stats(){let s=dash.stats;return `<div class="statrow"><button type="button" class="stat statbutton" data-stat="all"><span class="muted">Listings</span><strong>${s.donations}</strong><span class="stat-hint">View listings</span></button><button type="button" class="stat statbutton" data-stat="available"><span class="muted">Available</span><strong>${s.available}</strong><span class="stat-hint">Show available food</span></button><button type="button" class="stat statbutton" data-stat="pending"><span class="muted">Pending requests</span><strong>${s.pending}</strong><span class="stat-hint">Review pending</span></button><button type="button" class="stat statbutton" data-stat="completed"><span class="muted">Completed</span><strong>${s.completed}</strong><span class="stat-hint">View completed</span></button></div>`}function donationForm(){return `<div class="card"><h3>Publish surplus food</h3><form id="df"><div class="field"><label>Food title</label><input name="title" required></div><div class="grid"><div class="field"><label>Category</label><select name="category"><option>Prepared meals</option><option>Bakery</option><option>Produce</option><option>Dairy</option><option>Packaged food</option><option>Staples</option><option>Other</option></select></div><div class="field"><label>Quantity</label><input name="quantity" type="number" min="0.1" step="0.1" required value="10"></div></div><div class="grid"><div class="field"><label>Unit</label><select name="unit"><option>servings</option><option>meals</option><option>kg</option><option>boxes</option><option>items</option><option>packets</option></select></div><div class="field"><label>Expiry</label><input name="expiryAt" type="datetime-local"></div></div><div class="field"><label>Description</label><textarea name="description"></textarea></div><div class="field"><label>Food photo (JPG/PNG/WebP, max 5MB)</label><input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></div><div class="field"><label>Pickup instructions</label><input name="pickupNotes"></div><input type="hidden" name="latitude"><input type="hidden" name="longitude"><div class="row"><button type="button" class="alt" id="gps">⌖ Use my GPS</button><span id="gpsmsg" class="muted">Optional</span></div><button style="margin-top:12px">Publish donation</button></form></div>`}function needForm(){return `<div class="card"><h3>Post a food need</h3><form id="nf"><div class="field"><label>Food needed</label><input name="title" required></div><div class="grid"><div class="field"><label>Quantity</label><input name="quantity" type="number" min="1" required value="10"></div><div class="field"><label>Category</label><input name="category"></div></div><div class="grid"><div class="field"><label>Needed by</label><input name="neededBy" type="date"></div><div class="field"><label>Area</label><input name="area"></div></div><div class="field"><label>Notes</label><textarea name="notes"></textarea></div><input type="hidden" name="latitude"><input type="hidden" name="longitude"><div class="row"><button type="button" class="alt" id="nfgps">? Use my GPS</button><span id="nfgpsmsg" class="muted">Optional</span></div><button style="margin-top:12px">Post need</button></form></div>`}function food(d,requestable=false){return `<article class="food"><div class="photo">${d.image_path?`<img src="${esc(d.image_path)}">`:'🥗'}</div><div class="foodbody"><div class="row"><span class="pill">${esc(d.category)}</span><span class="status ${esc(d.status)}">${esc(d.status)}</span></div><h3>${esc(d.title)}</h3><p class="muted">${esc(d.description||'No description')} · ${esc(d.quantity)} ${esc(d.unit)} · Donor: ${esc(d.donor_name||'')}</p><p class="muted">Expiry: ${dt(d.expiry_at)} ${d.latitude!=null?`· <a target="_blank" href="https://www.openstreetmap.org/?mlat=${d.latitude}&mlon=${d.longitude}">Pickup map</a>`:''}</p><p class="muted">${esc(d.pickup_notes||'')}</p>${requestable&&d.status==='available'?`<button class="ask" data-id="${d.id}" data-title="${esc(d.title)}" data-max="${d.quantity}">Request food</button>`:''}</div></article>`}function reqItem(r,donor){let a='';if(donor&&r.status==='pending')a=`<button class="accept" data-id="${r.id}">Accept</button> <button class="red reject" data-id="${r.id}">Reject</button>`;else if(!donor&&['pending','accepted'].includes(r.status))a=`<button class="alt cancel" data-id="${r.id}">Cancel</button>`;if(me.role==='admin'&&r.status==='accepted')a=`<button class="complete" data-id="${r.id}">Mark completed</button>`;if(['ngo','receiver'].includes(me.role)&&r.status==='completed'&&!dash.feedback.some(f=>f.request_id===r.id))a+=` <button class="rate" data-id="${r.id}">Rate donation</button>`;return `<div class="item"><div class="row"><b>${esc(r.donation_title)}</b><span class="status ${esc(r.status)}">${esc(r.status)}</span></div><p>Recipient: ${esc(r.requester_name||'You')} · Quantity: ${r.quantity}</p><p>${esc(r.message||'')} · ${dt(r.created_at)}</p><div class="row">${a}</div></div>`}function render(){let donor=me.role==='donor',rec=['ngo','receiver'].includes(me.role),admin=me.role==='admin';$('#app').innerHTML=`<section class="hero"><h1>Make surplus food matter.</h1><p>Food donations, requests, handovers and feedback — stored locally in your database.</p><p style="margin-top:12px"><span class="pill">${esc(me.role)}</span> &nbsp; ${esc(me.email)}</p></section>${stats()}<div class="tabs">${[['overview','Overview'],['listings','Listings'],['requests','Requests'],['needs','Needs'],...(admin?[['users','Users']]:[])].map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${v}</button>`).join('')}</div><div id="flash"></div><div id="content"></div>`;let c=$('#content');if(tab==='overview'){c.innerHTML=`<div class="cols"><div><div class="card"><h3>${donor?'Incoming requests':rec?'Your requests':'Recent listings'}</h3>${(donor||rec?dash.requests:dash.donations).slice(0,6).map(x=>donor||rec?reqItem(x,donor):`<div class="item"><b>${esc(x.title)}</b><p>${esc(x.donor_name)} · ${x.quantity} ${esc(x.unit)}</p></div>`).join('')||'<p class="muted">Nothing here yet.</p>'}</div><div class="card"><h3>Feedback</h3>${dash.feedback.map(f=>`<div class="item"><b>${esc(f.donation_title)} · ★ ${((f.quality+f.freshness+f.hygiene)/3).toFixed(1)}</b><p>${esc(f.reviewer_name)}: ${esc(f.comments)}</p></div>`).join('')||'<p class="muted">Feedback appears after completed donations.</p>'}</div></div><div>${donor?donationForm():rec?needForm():`<div class="card"><h3>Admin tools</h3><p class="muted">Manage registered accounts in Users.</p></div>`}<div class="card"><h3>Workflow</h3><p class="muted">1. Donor lists surplus food.<br>2. NGO/receiver requests it.<br>3. Donor accepts or rejects.<br>4. Admin can mark accepted requests completed; recipient can then rate.</p></div></div></div>`}else if(tab==='listings'){let rows=dash.donations.filter(d=>listingFilter==='all'||d.status===listingFilter);c.innerHTML=(donor?donationForm():'')+`<div class="card"><div class="row filterbar"><b>${donor?'My food listings':rec?'Browse food':'All food listings'}</b><div class="filterset">${[['all','All'],['available','Available'],['reserved','Reserved'],['completed','Completed']].map(([v,l])=>`<button type="button" class="filterchip ${listingFilter===v?'selected':''}" data-list-filter="${v}">${l}</button>`).join('')}</div></div><div class="field"><label>Search listings</label><input id="search" placeholder="Food, category, donor"></div><div class="grid" id="foodlist">${rows.map(d=>food(d,rec)).join('')||'<p class="muted">No listings match this filter.</p>'}</div></div>`}else if(tab==='requests'){let rows=dash.requests.filter(r=>requestFilter==='all'||r.status===requestFilter);c.innerHTML=`<div class="card"><div class="row filterbar"><h3>${donor?'Incoming requests':rec?'My requests':'All requests'}</h3><div class="filterset">${[['all','All'],['pending','Pending'],['accepted','Accepted'],['completed','Completed'],['rejected','Rejected'],['cancelled','Cancelled']].map(([v,l])=>`<button type="button" class="filterchip ${requestFilter===v?'selected':''}" data-request-filter="${v}">${l}</button>`).join('')}</div></div>${rows.map(r=>reqItem(r,donor)).join('')||'<p class="muted">No requests match this filter.</p>'}</div>`}else if(tab==='needs')c.innerHTML=(rec?needForm():'')+`<div class="card"><h3>${donor?'Community food needs':'Your food needs'}</h3>${dash.needs.map(n=>`<div class="item"><b>${esc(n.title)}</b> <span class="status">${esc(n.status)}</span><p>${n.quantity} · ${esc(n.category)} · Needed by ${esc(n.needed_by)} · ${esc(n.area)}</p><p>${esc(n.notes)}</p>${n.latitude!=null&&n.longitude!=null?`<p><a target="_blank" rel="noopener" href="https://www.openstreetmap.org/?mlat=${n.latitude}&mlon=${n.longitude}">Open need location map</a></p>`:''}${donor&&n.status==='open'?`<button class="match" data-id="${n.id}">Mark matched</button>`:''}</div>`).join('')||'<p class="muted">No food needs posted.</p>'}</div>`;else if(tab==='users'&&admin)c.innerHTML='<div class="card"><h3>Registered users</h3><div id="userlist">Loading…</div></div>';wire();if(tab==='users'&&admin)api('/api/admin/users').then(d=>{$('#userlist').innerHTML=d.users.map(u=>`<div class="item"><b>${esc(u.name)}</b> · ${esc(u.role)} · ${esc(u.email)} · ${u.suspended?'Suspended':'Active'} <button class="alt suspend" data-id="${u.id}" data-val="${u.suspended?0:1}">${u.suspended?'Restore':'Suspend'}</button></div>`).join('');wire()})}function wire(){document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});document.querySelectorAll('[data-stat]').forEach(b=>b.onclick=()=>{let v=b.dataset.stat;if(v==='pending'){tab='requests';requestFilter='pending'}else if(v==='completed'){tab='requests';requestFilter='completed'}else{tab='listings';listingFilter=v}render()});document.querySelectorAll('[data-list-filter]').forEach(b=>b.onclick=()=>{listingFilter=b.dataset.listFilter;render()});document.querySelectorAll('[data-request-filter]').forEach(b=>b.onclick=()=>{requestFilter=b.dataset.requestFilter;render()});let df=$('#df');if(df){$('#gps').onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{df.latitude.value=p.coords.latitude;df.longitude.value=p.coords.longitude;$('#gpsmsg').textContent='Location saved';},()=>flash('GPS permission denied or unavailable.',true)):flash('GPS unavailable.',true);df.onsubmit=async e=>{e.preventDefault();let fd=new FormData(df);if(fd.get('expiryAt'))fd.set('expiryAt',new Date(fd.get('expiryAt')).toISOString());try{await api('/api/donations',{method:'POST',body:fd});await load();tab='donations';render()}catch(e){flash(e.message,true)}}}let nf=$('#nf');if(nf){let gps=$('#nfgps');if(gps)gps.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{nf.latitude.value=p.coords.latitude;nf.longitude.value=p.coords.longitude;$('#nfgpsmsg').textContent='Location saved'},()=>flash('GPS permission denied or unavailable.',true)):flash('GPS unavailable.',true)}if(nf)nf.onsubmit=async e=>{e.preventDefault();try{await api('/api/needs',{method:'POST',body:Object.fromEntries(new FormData(nf))});await load();tab='needs';render()}catch(e){flash(e.message,true)}};document.querySelectorAll('.ask').forEach(b=>b.onclick=async()=>{let q=prompt('Quantity requested (max '+b.dataset.max+')',Math.min(5,+b.dataset.max));if(q===null)return;let message=prompt('Message to donor (optional)','We would like to collect this donation.');try{await api('/api/donations/'+b.dataset.id+'/requests',{method:'POST',body:{quantity:+q,message}});await load();tab='requests';render()}catch(e){flash(e.message,true)}});document.querySelectorAll('.accept,.reject,.cancel,.complete').forEach(b=>b.onclick=async()=>{let status=b.classList.contains('accept')?'accepted':b.classList.contains('reject')?'rejected':b.classList.contains('cancel')?'cancelled':'completed';try{await api('/api/requests/'+b.dataset.id+'/status',{method:'PATCH',body:{status}});await load();render()}catch(e){flash(e.message,true)}});document.querySelectorAll('.match').forEach(b=>b.onclick=async()=>{try{await api('/api/needs/'+b.dataset.id+'/match',{method:'PATCH',body:{}});await load();render()}catch(e){flash(e.message,true)}});document.querySelectorAll('.rate').forEach(b=>b.onclick=()=>{let quality=+prompt('Food quality rating (1–5)',5),freshness=+prompt('Freshness rating (1–5)',5),hygiene=+prompt('Packaging and hygiene rating (1–5)',5),comments=prompt('Comments','Food was packed well.');api('/api/requests/'+b.dataset.id+'/feedback',{method:'POST',body:{quality,freshness,hygiene,comments}}).then(()=>load().then(render)).catch(e=>flash(e.message,true))});document.querySelectorAll('.suspend').forEach(b=>b.onclick=async()=>{try{await api('/api/admin/users/'+b.dataset.id,{method:'PATCH',body:{suspended:+b.dataset.val}});render()}catch(e){flash(e.message,true)}});let search=$('#search');if(search)search.oninput=()=>{let q=search.value.toLowerCase();$('#foodlist').innerHTML=dash.donations.filter(d=>(listingFilter==='all'||d.status===listingFilter)&&[d.title,d.category,d.donor_name].join(' ').toLowerCase().includes(q)).map(d=>food(d,me.role==='ngo'||me.role==='receiver')).join('')||'<p class="muted">No listings match this search.</p>'}}
(async()=>{try{let d=await api('/api/me');me=d.user;await load()}catch(e){auth()}})();
</script></body></html>
